feedback: |
  UX: Excellent voice-first design for AI glasses. Conversation state display
  is minimal and glance-able. Start/Stop via button is appropriate for touchpad.
  TTS fallback for error states is a good safety net.

  Code: Robust lifecycle pattern correctly applied. ConversationState enum is
  clean. One minor issue: LiveSession.close() is not explicitly called in
  stopConversation(), which could lead to resource leaks. Session reference
  should be stored as a class field and closed on stop. -1 point for this.
  Error handling in startConversation is good with try-catch and TTS fallback.

  Reusability: Gemini Live initialization pattern, ConversationState enum,
  and voice-first UI layout are all extractable for other voice experiments.

  Documentation: Comprehensive README covering prerequisites (Firebase config),
  voice conversation flow, design decisions, and run instructions.
